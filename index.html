:root{color-scheme:dark}

.bg-arabesque{background-image:url("data:image/svg+xml,%3Csvg width='96' height='96' viewBox='0 0 96 96' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23c9a45c' stroke-width='.6' opacity='.5'%3E%3Cpath d='M48 8L58 38 88 48 58 58 48 88 38 58 8 48 38 38Z'/%3E%3Cpath d='M48 20L55 41 76 48 55 55 48 76 41 55 20 48 41 41Z'/%3E%3Ccircle cx='48' cy='48' r='6'/%3E%3C/g%3E%3C/svg%3E");background-size:96px 96px}

@keyframes float-slow{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes spin-very-slow{to{transform:rotate(360deg)}}
@keyframes glow-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes drift{to{background-position:96px 96px}}
@keyframes pulse-dot{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(12px);opacity:.2}}
@keyframes page-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.animate-float-slow{animation:float-slow 7s ease-in-out infinite}
.animate-spin-very-slow{animation:spin-very-slow 60s linear infinite}
.animate-spin-very-slow-reverse{animation:spin-very-slow 80s linear infinite reverse}
.animate-glow-pulse{animation:glow-pulse 5s ease-in-out infinite}
.animate-drift{animation:drift 40s linear infinite}.page-enter{animation:page-in .45s cubic-bezier(.21,.6,.35,1) both}
.card-frame{position:relative}.card-frame:before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,92,.18);border-radius:inherit;pointer-events:none;transition:border-color .4s}
.card-frame:hover:before{border-color:rgba(201,164,92,.45)}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.21,.6,.35,1),transform .7s cubic-bezier(.21,.6,.35,1)}
.reveal.visible{opacity:1;transform:none}
.mobile-menu{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s,visibility .28s}
.mobile-menu.open{opacity:1;visibility:visible;pointer-events:auto}
.hamb span{transition:.3s}.hamb.open span:nth-child(1){top:50%;transform:translateY(-50%) rotate(45deg)}
.hamb.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamb.open span:nth-child(3){bottom:50%;transform:translateY(50%) rotate(-45deg)}
.skip-link{position:fixed;top:10px;right:10px;z-index:100;padding:10px 16px;border-radius:999px;background:#e0c37e;color:#080d0b;transform:translateY(-160%);transition:.2s}
.skip-link:focus{transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.reveal{opacity:1;transform:none}}

function svg(path,cls='h-7 w-7'){

function icon(name,cls='h-6 w-6'){return svg(PATHS[name]||PATHS.arrow,cls)}

function logo(size=64,glow=false,ring=false){
 let dots='';
 for(let i=0;i<8;i++){let a=i*Math.PI/4;dots+=`<circle cx="${50+48*Math.cos(a)}" cy="${50+48*Math.sin(a)}" r="1.4" fill="currentColor"/>`}
 return `<div class="relative shrink-0 select-none" style="width:${size}px;height:${size}px" aria-hidden="true">
 ${glow?'<div class="animate-glow-pulse absolute -inset-[12%] rounded-full blur-2xl" style="background:radial-gradient(circle,rgba(201,164,92,.35) 0%,transparent 70%)"></div>':''}
 ${ring?`<svg viewBox="0 0 100 100" class="animate-spin-very-slow absolute -inset-[9%] h-[118%] w-[118%] text-gold-500/50"><circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width=".75" stroke-dasharray="1.5 5"/>${dots}</svg>`:''}
 <div class="absolute inset-0 rounded-full bg-gradient-to-b from-gold-400 via-gold-600 to-gold-400 p-[2px] shadow-lg shadow-black/40">
 <div class="h-full w-full overflow-hidden rounded-full ring-1 ring-black/30">
 <img src="assets/logo.jpg" alt="شعار مؤسسة وعي" class="h-full w-full scale-[1.02] object-cover" draggable="false">
 </div></div></div>`;
}

function currentRoute(){return(location.hash.replace(/^#/,'')||'/').split('?')[0]||'/'}
function scrollToSection(target){const el=document.querySelector(target);if(el)requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth',block:'start'}))}
function navTo(target){
 if(target.startsWith('#')){if(currentRoute()==='/')scrollToSection(target);else{location.hash='/';setTimeout(()=>scrollToSection(target),70)}closeMenu();return}
 if(location.hash!==`#${target}`)location.hash=target;else render();closeMenu();
}
function closeMenu(){const m=document.getElementById('mobileMenu'),b=document.getElementById('hamb');m?.classList.remove('open');b?.classList.remove('open');b?.setAttribute('aria-expanded','false');document.body.classList.remove('menu-open')}
function toggleMenu(){const m=document.getElementById('mobileMenu'),b=document.getElementById('hamb');if(!m||!b)return;const o=!m.classList.contains('open');m.classList.toggle('open',o);b.classList.toggle('open',o);b.setAttribute('aria-expanded',String(o));document.body.classList.toggle('menu-open',o)}
let observer=null;
function setupReveal(){
 if(observer)observer.disconnect();const items=document.querySelectorAll('.reveal');
 if(!('IntersectionObserver' in window)){items.forEach(e=>e.classList.add('visible'));return}
 observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -30px 0px'});
 items.forEach(e=>{if(e.getBoundingClientRect().top<innerHeight*.92)e.classList.add('visible');observer.observe(e)})
}
function setupAccordions(){document.querySelectorAll('.accordion-btn').forEach(b=>b.addEventListener('click',()=>toggleAccordion(b)))}
function toggleAccordion(btn){
 const box=btn.closest('.card-frame'),body=box?.querySelector('.accordion-body');if(!body)return;
 const open=!body.classList.contains('hidden');
 document.querySelectorAll('.accordion-body').forEach(b=>b.classList.add('hidden'));
 document.querySelectorAll('.accordion-btn').forEach(b=>b.setAttribute('aria-expanded','false'));
 document.querySelectorAll('.chev').forEach(c=>c.classList.remove('rotate-180'));
 if(!open){body.classList.remove('hidden');btn.setAttribute('aria-expanded','true');box.querySelector('.chev')?.classList.add('rotate-180')}
}
function bind(){
 document.querySelectorAll('[data-route]').forEach(e=>e.addEventListener('click',()=>navTo(e.dataset.route)));
 document.querySelectorAll('[data-nav]').forEach(e=>e.addEventListener('click',()=>navTo(e.dataset.nav)));
 document.getElementById('hamb')?.addEventListener('click',toggleMenu);
 setupAccordions();setupReveal();
 document.querySelectorAll('[data-placeholder-link]').forEach(e=>e.addEventListener('click',x=>{x.preventDefault();e.classList.add('opacity-70')}))
}
function render(){
 const r=currentRoute(),p=r.startsWith('/register')?register():r.startsWith('/official')?official():home();
 document.getElementById('app').innerHTML=navbar()+p+footer();bind();window.scrollTo({top:0,left:0,behavior:'instant'});
}
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
window.addEventListener('resize',()=>{if(innerWidth>=1024)closeMenu()},{passive:true});
window.addEventListener('scroll',()=>{const n=document.getElementById('navbar');if(n){const s=scrollY>24;n.className='fixed inset-x-0 top-0 z-50 border-b transition-all duration-500 '+(s?'border-gold-500/15 bg-night-950/85 shadow-lg shadow-black/30 backdrop-blur-xl':'border-transparent bg-transparent')}},{passive:true});
render();
</script>
</body>
</html>
